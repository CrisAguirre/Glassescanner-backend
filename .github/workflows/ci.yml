name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # opencv (arrastrado por mediapipe) necesita estas libs en Ubuntu.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libsm6 libxext6 libxrender1
      - run: pip install -r requirements.txt
      # E/F = errores reales; el resto de reglas se activa al cerrar la Fase 4.
      - run: ruff check app tests --select E,F
      - run: pytest -q
